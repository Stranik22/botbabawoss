<!doctype html>
<html lang="ru"><head><style>
*{box-sizing:border-box}body{margin:0;padding:0;color:var(--tg-theme-text-color);font:14px/1.35 system-ui}main{padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}header b{font-size:12px;letter-spacing:.03em}header span{color:var(--tg-theme-hint-color);font-size:12px}.mark{color:#ff5a17;font-size:20px;vertical-align:middle}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0}button{font:inherit;border:1px solid var(--tg-theme-section-separator-color);border-radius:10px;padding:9px 5px;color:var(--tg-theme-text-color);background:var(--tg-theme-secondary-bg-color)}button[aria-pressed=true]{border-color:#ff5a17;box-shadow:inset 0 0 0 1px #ff5a17}button:disabled{opacity:.5}nav button{font-size:12px;padding:8px 3px}h2{font-size:18px;line-height:1.25;margin:10px 0}h3{font-size:12px;font-weight:500;color:var(--tg-theme-hint-color);margin:10px 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.sizes{grid-template-columns:repeat(3,minmax(0,1fr))}.colors{grid-template-columns:repeat(4,minmax(0,1fr))}.stack{grid-template-columns:1fr}.grid button{min-width:0;overflow-wrap:anywhere;font-size:13px}.swatch{display:block;height:19px;border-radius:5px;margin-bottom:4px;border:1px solid var(--tg-theme-section-separator-color)}.total{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px;padding-top:10px;border-top:1px solid var(--tg-theme-section-separator-color)}.total>div{min-width:0}.total strong{font-size:24px;letter-spacing:-.04em}.total small{color:var(--tg-theme-hint-color);font-size:12px}p{margin:4px 0;color:var(--tg-theme-hint-color);font-size:12px}.actions{display:grid;grid-template-columns:1fr 2fr;gap:7px;margin-top:12px}.primary{background:#ff5a17;color:#101010;border-color:#ff5a17;font-weight:700}.status{min-height:17px;margin-top:6px;font-size:12px;color:var(--tg-theme-hint-color)}footer{padding-bottom:max(5px,env(safe-area-inset-bottom));padding-right:max(0px,var(--tg-content-safe-area-corner-right))}@media(max-width:260px){main{padding:10px}.grid button{font-size:12px;padding:7px 4px}header b{font-size:11px}h2{font-size:16px;margin:6px 0}h3{margin-top:7px}.total strong{font-size:22px}#detail,#fabric{display:none}}
</style></head><body><main>
<header><b><span class="mark">●</span> РЫЖАЯ БОРОДА</b><span>7 раб. дней</span></header><nav id="tabs" aria-label="Настройка кровати"></nav><h2 id="title">Соберите свою кровать</h2><div id="groups"></div><p id="foam" hidden>Пенополиуретан (ППУ) 40 мм — упругий наполнитель под тканью.</p>
<div class="total"><div><small id="totalLabel">Кровати, без доставки</small><br><strong id="price" aria-live="polite"></strong></div><button id="photo" type="button" aria-label="Показать фото выбранной кровати" disabled>Фото ↗</button></div>
<p id="detail"></p><p id="fabric"></p><footer><div class="actions"><button id="back" type="button" disabled>Назад</button><button id="next" class="primary" type="button" disabled>Дальше</button></div><div id="status" class="status" aria-live="polite"></div></footer>
</main><script>
var W=TelegramWidget,S=null,busy=false;
function el(id){return document.getElementById(id)}
function button(text,action,on,color,off){var b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',on?'true':'false');b.disabled=busy||!!off;if(/^#[a-fA-F0-9]{6}$/.test(color||'')){var c=document.createElement('span');c.className='swatch';c.style.backgroundColor=color;b.appendChild(c)}b.appendChild(document.createTextNode(text));b.addEventListener('click',function(){ask(action)});return b}
function valid(n){if(!n||n.v!==1||!Number.isInteger(n.r)||n.r<1||!Number.isInteger(n.s)||n.s<0||n.s>2||!Array.isArray(n.g)||n.g.length>4||!n.g.every(function(g){return Array.isArray(g)&&typeof g[0]==='string'&&Array.isArray(g[1])&&g[1].length<=12&&g[1].every(function(o){return Array.isArray(o)&&typeof o[0]==='string'&&typeof o[1]==='string'})})||!['t','p','d','f','u'].every(function(k){return typeof n[k]==='string'}))return false;try{var u=new URL(n.u);return n.u.length<=256&&u.protocol==='https:'&&u.hostname==='redbeards.ru'&&!u.port&&!u.username&&!u.password}catch(e){return false}}
function apply(raw){try{var n=typeof raw==='string'?JSON.parse(raw):raw;if(!valid(n))return false;if(S&&n.r<S.r){draw();return true}S=n;draw();return true}catch(e){return false}}
function draw(){if(!S)return;el('title').textContent=S.t;el('price').textContent=S.p;el('totalLabel').textContent=S.q?'Известная часть':'Кровати, без доставки';el('detail').textContent=S.d;el('fabric').textContent=S.f;el('foam').hidden=S.s!==2;el('tabs').textContent='';['Модель','Ткань','Опции'].forEach(function(t,i){el('tabs').appendChild(button(t,'n'+i,S.s===i))});el('groups').textContent='';S.g.forEach(function(g){var h=document.createElement('h3');h.textContent=g[0];el('groups').appendChild(h);var box=document.createElement('div');box.className='grid '+(['sizes','colors','stack'].indexOf(g[2])>=0?g[2]:'');g[1].forEach(function(o){box.appendChild(button(o[0],o[1],o[2],o[3],o[4]))});el('groups').appendChild(box)});el('back').disabled=busy||S.s===0;el('next').disabled=busy;el('photo').disabled=busy;el('next').textContent=S.s===2?(S.q?'Запросить расчёт':'Продолжить оформление'):'Дальше';el('status').textContent=busy?'Обновляем…':S.e||''}
function ask(a){if(busy||!S)return;var p;try{p=W.request(S.r+':'+a)}catch(e){el('status').textContent='Не удалось отправить. Повторите.';return}busy=true;draw();p.then(function(answer){busy=false;if(!apply(answer.result)){draw();el('status').textContent='Не удалось обновить. Повторите выбор.'}},function(e){busy=false;draw();el('status').textContent=e.code==='RATE_LIMITED'?'Слишком быстро. Повторите через секунду.':'Не удалось обновить. Повторите выбор.'})}
el('back').addEventListener('click',function(){if(S)ask('n'+Math.max(0,S.s-1))});el('photo').addEventListener('click',function(){ask('photo')});el('next').addEventListener('click',function(){if(!S||busy)return;if(S.s===2)W.openLink(S.u);else ask('n'+(S.s+1))});W.onEvent('chatDataChanged',function(){apply(W.chatData)});if(!apply(W.chatData))el('status').textContent='Отправьте /start, чтобы открыть конструктор.';W.ready();
</script></body></html>
